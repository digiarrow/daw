name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Ninja)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers and audio/GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build g++ cmake pkg-config \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos-ninja:
    name: macOS (Ninja, CoreAudio)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos-xcode:
    name: macOS (Xcode)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-xcode -G Xcode -DWAVEFORM_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-xcode --config Release --parallel
      - name: Test
        run: ctest --test-dir build-xcode -C Release --output-on-failure

  macos-universal:
    name: macOS universal (arm64 + x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake -S . -B build-universal -G Ninja -DCMAKE_BUILD_TYPE=Release -DWAVEFORM_MACOS_UNIVERSAL=ON
      - name: Build
        run: cmake --build build-universal
      - name: Test
        run: ctest --test-dir build-universal --output-on-failure
      - name: Confirm both architectures
        run: lipo -info "build-universal/bin/WaveformStudio.app/Contents/MacOS/WaveformStudio"

  windows:
    name: Windows (Visual Studio 2026, WASAPI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DWAVEFORM_ENABLE_ASIO=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  package-macos:
    name: macOS disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Package and ad-hoc sign
        run: ./scripts/package-macos.sh
      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: WaveformStudio-macos
          path: build-package/package/*.dmg
          if-no-files-found: error

  package-windows:
    name: Windows zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: WaveformStudio-windows
          path: build-package/package/*.zip
          if-no-files-found: error
